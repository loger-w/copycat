[project]
name = "copycat"
version = "0.1.0"
description = "分點行為指紋辨識 — 評分引擎 + 歷史 replay(回測基建)"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
live = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pyzmq>=26"]
capital = ["comtypes>=1.4", "pywin32>=306"]
discord = ["discord.py>=2.4"]
dev = ["pytest>=8", "ruff>=0.5", "pyright>=1.1", "httpx>=0.27", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# 預設集(E4/E7/E9/F,由 ruff 自己維護)之外加 logging 格式引數數量(PLE1205 多給 /
# PLE1206 少給):`logger.info("%s %s", a)` 只有機器攔得住,人眼在四個 %s 對三個值時看不出來
# (pr-175-review F-03;09-07 盤點 B14)。加規則前全庫掃過:存量 0。
# `extend-select` 而非 `select`:後者會把預設集凍在寫下的那一版(pr-202-review F-02)。
extend-select = ["PLE1205", "PLE1206"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["copycat", "tests"]
exclude = ["**/__pycache__", ".venv", "spikes", "docs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]   # tests 跨檔共用 fixture helper(tests.data.test_import_neigui)需要

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["copycat*"]
