<!doctype html><html><head><meta charset="utf-8"><title>viewport host</title>
<style>html,body{margin:0;background:#222}iframe{border:0;display:block;background:#000}</style></head>
<body><iframe id="f"></iframe>
<script>
const q=new URLSearchParams(location.search);const w=+q.get('w')||1920,h=+q.get('h')||1080;
const f=document.getElementById('f');f.width=w;f.height=h;f.style.width=w+'px';f.style.height=h+'px';f.src='http://localhost:5173/';
</script></body></html>
